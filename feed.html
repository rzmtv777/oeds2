<!DOCTYPE html>
<html lang="en" data-theme="black-red">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Galerey — Feed</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <style>
    .create-post-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      margin-bottom: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .create-post-bar:hover { border-color: var(--primary); }
    .create-post-bar .avatar { border: 2px solid var(--primary); }
    .create-post-bar .placeholder { flex: 1; font-size: 14px; color: var(--text-muted); padding: 10px 16px; background: rgba(255,255,255,0.04); border-radius: 24px; }
    .create-post-bar .actions { display: flex; gap: 8px; }
    .create-post-bar .actions button { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.06); color: var(--text-secondary); font-size: 16px; cursor: pointer; transition: var(--transition); }
    .create-post-bar .actions button:hover { background: rgba(255,255,255,0.12); color: var(--primary); }
    .feed-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .feed-tabs::-webkit-scrollbar { display: none; }
    .feed-tab { padding: 8px 20px; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; cursor: pointer; transition: var(--transition); white-space: nowrap; }
    .feed-tab.active { background: var(--gradient-primary); color: #fff; border-color: transparent; }
    .feed-tab:hover:not(.active) { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

  <div class="top-nav">
    <div class="nav-brand"><div class="nav-brand-icon">🎓</div><span data-i18n="app_name">My Galerey</span></div>
    <div class="nav-actions">
      <button class="nav-btn" onclick="location.href='home.html'"><i class="fas fa-home"></i></button>
      <button class="nav-btn" onclick="location.href='chat.html'"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <div class="main-content">
    <div class="page-container" style="max-width:600px;margin:0 auto">
      <h1 style="font-family:var(--font-heading);font-size:24px;font-weight:700;margin-bottom:20px" data-i18n="feed">Feed</h1>

      <div class="create-post-bar" onclick="openCreatePost()">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=80&h=80&fit=crop" class="avatar avatar-md" alt="">
        <div class="placeholder" data-i18n="write_caption">Write a caption...</div>
        <div class="actions">
          <button><i class="fas fa-image"></i></button>
          <button><i class="fas fa-video"></i></button>
        </div>
      </div>

      <div class="feed-tabs">
        <button class="feed-tab active" data-i18n="for_you">For You</button>
        <button class="feed-tab" data-i18n="following">Following</button>
        <button class="feed-tab" data-i18n="recent">Recent</button>
        <button class="feed-tab" data-i18n="popular">Popular</button>
      </div>

      <!-- Posts (same structure as home.html) -->
      <div id="feedPosts"></div>

      <div class="empty-state" id="emptyFeed">
        <i class="fas fa-camera-retro"></i>
        <h3 data-i18n="no_posts_yet">No posts yet</h3>
        <p data-i18n="share_first_moment">Share your first moment!</p>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="bottom-nav-item" onclick="location.href='home.html'"><i class="fas fa-home"></i><span data-i18n="home">Home</span></button>
    <button class="bottom-nav-item active" onclick="location.href='feed.html'"><i class="fas fa-newspaper"></i><span data-i18n="feed">Feed</span></button>
    <button class="bottom-nav-item" onclick="location.href='reels.html'"><i class="fas fa-play-circle"></i><span data-i18n="reels">Reels</span></button>
    <button class="bottom-nav-item" onclick="location.href='chat.html'"><i class="fas fa-paper-plane"></i><span data-i18n="chat">Chat</span></button>
    <button class="bottom-nav-item" onclick="location.href='profile.html'"><i class="fas fa-user"></i><span data-i18n="profile">Profile</span></button>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    MG_App.requireAuth('login.html');
    // Feed tabs
    document.querySelectorAll('.feed-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.feed-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>
</body>
</html>
