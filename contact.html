<!DOCTYPE html>
<html lang="en" data-theme="black-red">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Galerey — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <style>
    .contact-page { min-height: 100vh; padding: 80px 20px 100px; position: relative; z-index: 1; }
    .contact-hero { text-align: center; padding: 30px 20px; margin-bottom: 32px; }
    .contact-hero-icon { width: 80px; height: 80px; background: var(--gradient-primary); border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    .contact-hero h1 { font-family: var(--font-heading); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .contact-hero p { color: var(--text-secondary); font-size: 14px; }
    .contact-grid { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 500px; margin: 0 auto; }
    .contact-item { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: var(--radius); cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--text); }
    .contact-item:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); box-shadow: var(--shadow); }
    .contact-item-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .contact-item-icon.tg { background: linear-gradient(135deg, #0088cc, #00aaff); }
    .contact-item-icon.email { background: linear-gradient(135deg, #ff2d55, #ff6b6b); }
    .contact-item-icon.phone { background: linear-gradient(135deg, #00e676, #69f0ae); }
    .contact-item-icon.insta { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .contact-item-icon.loc { background: linear-gradient(135deg, #ff9100, #ffab40); }
    .contact-item-icon.time { background: linear-gradient(135deg, #bb86fc, #9c5cf7); }
    .contact-item h4 { font-size: 15px; font-weight: 600; }
    .contact-item p { font-size: 13px; color: var(--text-secondary); margin: 0; }
    .back-nav { position: fixed; top: 16px; left: 16px; z-index: 100; }
    @media(min-width:600px) { .contact-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

  <div class="back-nav">
    <button class="btn btn-icon btn-secondary" onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
  </div>

  <div class="contact-page">
    <div class="contact-hero">
      <div class="contact-hero-icon"><i class="fas fa-headset"></i></div>
      <h1 data-i18n="contact_us">Contact Us</h1>
      <p data-i18n="contact_admin">Contact admin for help</p>
    </div>

    <div class="contact-grid">
      <a href="https://t.me/mygalerey_admin" target="_blank" class="contact-item">
        <div class="contact-item-icon tg"><i class="fab fa-telegram"></i></div>
        <div><h4 data-i18n="telegram">Telegram</h4><p>@mygalerey_admin</p></div>
        <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
      </a>
      <a href="mailto:admin@mygalerey.com" class="contact-item">
        <div class="contact-item-icon email"><i class="fas fa-envelope"></i></div>
        <div><h4 data-i18n="email">Email</h4><p>admin@mygalerey.com</p></div>
        <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
      </a>
      <a href="tel:+998901234567" class="contact-item">
        <div class="contact-item-icon phone"><i class="fas fa-phone"></i></div>
        <div><h4 data-i18n="phone">Phone</h4><p>+998 90 123 45 67</p></div>
        <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
      </a>
      <a href="https://instagram.com/mygalerey" target="_blank" class="contact-item">
        <div class="contact-item-icon insta"><i class="fab fa-instagram"></i></div>
        <div><h4>Instagram</h4><p>@mygalerey</p></div>
        <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
      </a>
      <div class="contact-item">
        <div class="contact-item-icon loc"><i class="fas fa-map-marker-alt"></i></div>
        <div><h4 data-i18n="address">Address</h4><p data-i18n="address_val">Tashkent, Uzbekistan</p></div>
      </div>
      <div class="contact-item">
        <div class="contact-item-icon time"><i class="fas fa-clock"></i></div>
        <div><h4 data-i18n="working_hours">Working Hours</h4><p data-i18n="work_time">Mon-Fri: 8:00 AM - 6:00 PM</p></div>
      </div>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
