<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Men Haqimda | 9A</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-glass: rgba(18, 18, 26, 0.7);
      --text-primary: #e0e0e0; --text-secondary: #888899; --border: rgba(255, 255, 255, 0.08);
      --accent: #2d3561;
    }
    [data-theme="red"] {
      --bg-primary: #0a0000; --bg-secondary: #1a0505; --bg-glass: rgba(26, 5, 5, 0.7);
      --text-primary: #ffffff; --text-secondary: #aaaaaa; --border: rgba(255, 255, 255, 0.1);
      --accent: #ff0033;
    }
    [data-theme="orange"] {
      --bg-primary: #0a0500; --bg-secondary: #1a0f05; --bg-glass: rgba(26, 15, 5, 0.7);
      --text-primary: #ffffff; --text-secondary: #bbbbbb; --border: rgba(255, 255, 255, 0.08);
      --accent: #ff6600;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; }
    .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg-primary); }
    .ambient-glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.15; animation: ambientMove 25s infinite ease-in-out; background: var(--accent); }
    .glow-1 { width: 500px; height: 500px; top: -150px; left: -150px; }
    @keyframes ambientMove { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -30px) scale(1.1); } }
    .container { max-width: 800px; margin: 0 auto; padding: 80px 40px; }
    .glass-card { background: var(--bg-glass); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 24px; padding: 60px; box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4); }
    .page-header { text-align: center; margin-bottom: 50px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
    .badge::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
    h1 { font-size: 42px; font-weight: 700; margin-bottom: 16px; }
    .info-grid { display: grid; gap: 20px; margin-bottom: 40px; }
    .info-item { display: flex; align-items: flex-start; gap: 16px; padding: 20px; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 16px; }
    .info-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border-radius: 12px; flex-shrink: 0; }
    .info-icon i { font-size: 20px; color: var(--text-secondary); }
    .info-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; }
    .info-value { font-size: 15px; color: var(--text-primary); line-height: 1.6; }
    .info-value a { color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--border); }
    .triangular-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 32px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); transition: all 0.3s; }
    .triangular-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
    .back-btn { text-align: center; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="ambient-bg"><div class="ambient-glow glow-1"></div></div>
  <div class="container">
    <div class="glass-card">
      <div class="page-header">
        <div class="badge">Admin</div>
        <h1>Men Haqimda</h1>
      </div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-icon"><i class="fas fa-user"></i></div>
          <div><div class="info-label">To'liq Ism</div><div class="info-value">Ruzmetov Diyorbek</div></div>
        </div>
        <div class="info-item">
          <div class="info-icon"><i class="fas fa-envelope"></i></div>
          <div><div class="info-label">Email</div><div class="info-value">rzmtvdiyorbek21@gmail.com</div></div>
        </div>
        <div class="info-item">
          <div class="info-icon"><i class="fab fa-telegram-plane"></i></div>
          <div><div class="info-label">Telegram</div><div class="info-value"><a href="https://t.me/rzmtv_7z7">@rzmtv_7z7</a></div></div>
        </div>
        <div class="info-item">
          <div class="info-icon"><i class="fas fa-phone-alt"></i></div>
          <div><div class="info-label">Telefon</div><div class="info-value">+998 99 791 08 08</div></div>
        </div>
      </div>
      <div class="back-btn">
        <a href="index.html" class="triangular-btn"><i class="fas fa-arrow-left"></i> Orqaga</a>
      </div>
    </div>
  </div>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme && savedTheme !== 'default') document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
