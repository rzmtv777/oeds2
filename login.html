<!DOCTYPE html>
<html lang="en" data-theme="black-red">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Galerey — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      animation: fadeInScale 0.6s ease;
    }
    .auth-logo { text-align: center; margin-bottom: 32px; }
    .auth-logo .logo-icon {
      width: 72px; height: 72px;
      background: var(--gradient-primary);
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
    }
    .auth-logo h1 {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-logo p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
    .auth-tabs {
      display: flex;
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 8px;
      transition: var(--transition);
    }
    .auth-tab.active {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .forgot-link {
      display: block;
      text-align: right;
      color: var(--primary);
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .forgot-link:hover { text-decoration: underline; }
    .social-login { display: flex; gap: 12px; margin-bottom: 24px; }
    .social-btn {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .social-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
    .auth-footer { text-align: center; color: var(--text-secondary); font-size: 14px; }
    .auth-footer a { color: var(--primary); font-weight: 600; cursor: pointer; }
    .lang-select-auth {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }
    .lang-select-auth select {
      padding: 8px 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="lang-select-auth">
    <select onchange="MG_setLanguage(this.value)">
      <option value="en">🇬🇧 EN</option>
      <option value="uz">🇺🇿 UZ</option>
      <option value="tr">🇹🇷 TR</option>
      <option value="kk">🇰🇿 KK</option>
      <option value="ru">🇷🇺 RU</option>
    </select>
  </div>

  <div class="auth-page">
    <div class="auth-container liquid-glass">
      <div class="auth-logo">
        <div class="logo-icon">🎓</div>
        <h1 data-i18n="app_name">My Galerey</h1>
        <p data-i18n="welcome_back">Welcome back!</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-i18n="login">Login</button>
        <button class="auth-tab" onclick="location.href='register.html'" data-i18n="register">Register</button>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label data-i18n="phone_or_email">Phone or Gmail</label>
          <input type="text" class="input-field" id="loginEmail" required placeholder="+998 90 123 45 67">
          <i class="input-icon fas fa-envelope"></i>
        </div>

        <div class="input-group">
          <label data-i18n="password">Password</label>
          <input type="password" class="input-field" id="loginPassword" required placeholder="••••••••">
          <i class="input-icon fas fa-lock"></i>
          <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <a class="forgot-link" href="forgot-password.html" data-i18n="forgot_password">Forgot password?</a>

        <button type="submit" class="btn btn-lg btn-full">
          <i class="fas fa-sign-in-alt"></i>
          <span data-i18n="sign_in">Sign In</span>
        </button>
      </form>

      <div class="divider" data-i18n="or_continue_with">or continue with</div>

      <div class="social-login">
        <button class="social-btn" type="button" onclick="socialLogin('google')"><i class="fab fa-google"></i></button>
        <button class="social-btn" type="button" onclick="socialLogin('telegram')"><i class="fab fa-telegram"></i></button>
        <button class="social-btn" type="button" onclick="socialLogin('apple')"><i class="fab fa-apple"></i></button>
      </div>

      <div class="auth-footer">
        <span data-i18n="no_account">Don't have an account?</span>
        <a href="register.html" data-i18n="sign_up">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const icon = btn.querySelector('i');
      if (input.type === 'password') { input.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { input.type = 'password'; icon.className = 'fas fa-eye'; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { MG_showToast('Please fill all fields', 'error'); return; }

      // Save user
      const user = {
        id: MG_generateId(),
        name: 'User',
        username: email.split('@')[0] || 'user',
        email: email,
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop',
        bio: '',
        gender: 'male',
        role: 'parent',
        posts: 0,
        followers: 0,
        following: 0
      };
      MG_App.saveUser(user);
      MG_showToast(MG_t('login_success'), 'success');
      setTimeout(() => { window.location.href = 'home.html'; }, 800);
    }

    function socialLogin(provider) {
      const user = {
        id: MG_generateId(),
        name: 'User',
        username: provider + '_user',
        email: '',
        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&h=200&fit=crop',
        bio: '',
        gender: 'male',
        role: 'classmate',
        posts: 0, followers: 0, following: 0
      };
      MG_App.saveUser(user);
      MG_showToast(MG_t('login_success'), 'success');
      setTimeout(() => { window.location.href = 'home.html'; }, 800);
    }
  </script>
</body>
</html>
