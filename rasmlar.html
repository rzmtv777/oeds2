<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Sinf Rasmlari | 9A</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-glass: rgba(18, 18, 26, 0.7);
      --text-primary: #e0e0e0; --text-secondary: #888899; --border: rgba(255, 255, 255, 0.08);
      --accent: #2d3561;
    }
    [data-theme="red"] {
      --bg-primary: #0a0000; --bg-secondary: #1a0505; --bg-glass: rgba(26, 5, 5, 0.7);
      --text-primary: #ffffff; --text-secondary: #aaaaaa; --border: rgba(255, 255, 255, 0.1);
      --accent: #ff0033;
    }
    [data-theme="orange"] {
      --bg-primary: #0a0500; --bg-secondary: #1a0f05; --bg-glass: rgba(26, 15, 5, 0.7);
      --text-primary: #ffffff; --text-secondary: #bbbbbb; --border: rgba(255, 255, 255, 0.08);
      --accent: #ff6600;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; }
    .ambient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: var(--bg-primary); overflow: hidden; }
    .ambient-glow { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.15; animation: ambientMove 25s infinite ease-in-out; background: var(--accent); }
    .glow-1 { width: 500px; height: 500px; top: -150px; left: -150px; }
    .glow-2 { width: 400px; height: 400px; top: 40%; right: -100px; animation-delay: -8s; }
    @keyframes ambientMove { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(30px, -30px) scale(1.1); } }
    .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.03; background-image: url("image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); }
    .container { max-width: 1200px; margin: 0 auto; padding: 80px 40px; }
    .glass-card { background: var(--bg-glass); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 24px; padding: 60px; box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4); }
    .page-header { text-align: center; margin-bottom: 50px; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px; }
    .badge::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
    h1 { font-size: 42px; font-weight: 700; margin-bottom: 16px; }
    .names-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .name-card { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .name-card:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3); }
    .name-card i { font-size: 32px; color: var(--text-secondary); margin-bottom: 15px; display: block; }
    .name-card:hover i { color: var(--accent); }
    .name-text { font-size: 16px; font-weight: 600; color: var(--text-primary); text-transform: capitalize; }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px); z-index: 10000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
    .modal.active { opacity: 1; visibility: visible; }
    .modal-content { position: relative; max-width: 90%; max-height: 90%; transform: scale(0.8); transition: transform 0.3s; }
    .modal.active .modal-content { transform: scale(1); }
    .modal-img { max-width: 100%; max-height: 85vh; border-radius: 12px; box-shadow: 0 0 50px rgba(0, 0, 0, 0.5); border: 2px solid var(--border); }
    .modal-caption { text-align: center; margin-top: 15px; font-size: 20px; font-weight: 600; color: var(--text-primary); }
    .modal-close { position: absolute; top: -50px; right: 0; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; transition: all 0.3s; }
    .modal-close:hover { background: var(--accent); border-color: var(--accent); }
    .triangular-btn { display: inline-flex; align-items: center; gap: 12px; padding: 16px 32px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); transition: all 0.3s; margin-top: 40px; }
    .triangular-btn:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-2px); }
    .back-btn { text-align: center; }
    @media (max-width: 768px) { .container { padding: 40px 20px; } .glass-card { padding: 30px 20px; } .names-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="ambient-bg"><div class="ambient-glow glow-1"></div><div class="ambient-glow glow-2"></div></div>
  <div class="noise"></div>
  <div class="container">
    <div class="glass-card">
      <div class="page-header">
        <div class="badge">Gallery</div>
        <h1>1-Sinf Sinfdoshlari</h1>
        <p style="color: var(--text-secondary);">Rasmni ko'rish uchun ismni bosing</p>
      </div>
      <div class="names-grid" id="namesGrid"></div>
      <div class="back-btn">
        <a href="index.html" class="triangular-btn"><i class="fas fa-arrow-left"></i> Orqaga</a>
      </div>
    </div>
  </div>
  <div class="modal" id="photoModal" onclick="closeModal(event)">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModalBtn()"><i class="fas fa-times"></i></button>
      <img src="" alt="" class="modal-img" id="modalImg">
      <div class="modal-caption" id="modalCaption"></div>
    </div>
  </div>
  <script>
    const photoFiles = [
      'amirhan_1sinf.png', 'hasanboy_1sinf.png', 'marjona_1sinf.png',
      'quvanch_1sinf.png', 'ruxsora_1sinf.png', 'salah_1sinf.png',
      'volida_1sinf.png', 'waxzada_1sinf.png', 'xosinboy_1sinf.png',
      'yulawevaw_1sinf.png', 'zarnigor_1sinf.png', 'zubayda_1sinf.png'
    ];
    const grid = document.getElementById('namesGrid');
    const modal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const modalCaption = document.getElementById('modalCaption');

    photoFiles.forEach(file => {
      const name = file.split('_')[0].replace(/_/g, ' ');
      const card = document.createElement('div');
      card.className = 'name-card';
      card.innerHTML = `<i class="fas fa-user"></i><div class="name-text">${name}</div>`;
      card.onclick = () => {
        modalImg.src = `photos/${file}`;
        modalCaption.textContent = name;
        modal.classList.add('active');
      };
      grid.appendChild(card);
    });

    function closeModal(e) { if (e.target === modal) modal.classList.remove('active'); }
    function closeModalBtn() { modal.classList.remove('active'); }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('active'); });

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme && savedTheme !== 'default') document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
