<!DOCTYPE html>
<html lang="en" data-theme="black-red">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Galerey — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <style>
    .forgot-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; z-index: 1; }
    .forgot-container { width: 100%; max-width: 440px; padding: 40px 32px; text-align: center; animation: fadeInScale 0.6s ease; }
    .forgot-icon { width: 80px; height: 80px; background: var(--gradient-primary); border-radius: 24px; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
    .forgot-container h1 { font-family: var(--font-heading); font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .forgot-container p { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
    .contact-cards { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .contact-card { display: flex; align-items: center; gap: 14px; padding: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm); cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--text); }
    .contact-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .contact-card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .contact-card-icon.tg { background: linear-gradient(135deg, #0088cc, #00aaff); }
    .contact-card-icon.email { background: linear-gradient(135deg, #ff2d55, #ff6b6b); }
    .contact-card-icon.phone { background: linear-gradient(135deg, #00e676, #69f0ae); }
    .contact-card h4 { font-size: 14px; font-weight: 600; }
    .contact-card p { font-size: 12px; color: var(--text-muted); margin: 0; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); font-size: 14px; font-weight: 600; margin-top: 24px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

  <div class="forgot-page">
    <div class="forgot-container liquid-glass">
      <div class="forgot-icon"><i class="fas fa-key"></i></div>
      <h1 data-i18n="reset_password">Reset Password</h1>
      <p data-i18n="reset_desc">Contact our admin to reset your password. Choose your preferred contact method below.</p>

      <div class="contact-cards">
        <a href="https://t.me/mygalerey_admin" target="_blank" class="contact-card">
          <div class="contact-card-icon tg"><i class="fab fa-telegram"></i></div>
          <div><h4 data-i18n="telegram">Telegram</h4><p>@mygalerey_admin</p></div>
          <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
        </a>
        <a href="mailto:admin@mygalerey.com" class="contact-card">
          <div class="contact-card-icon email"><i class="fas fa-envelope"></i></div>
          <div><h4 data-i18n="email">Email</h4><p>admin@mygalerey.com</p></div>
          <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
        </a>
        <a href="tel:+998901234567" class="contact-card">
          <div class="contact-card-icon phone"><i class="fas fa-phone"></i></div>
          <div><h4 data-i18n="phone">Phone</h4><p>+998 90 123 45 67</p></div>
          <i class="fas fa-arrow-right" style="margin-left:auto;color:var(--text-muted)"></i>
        </a>
      </div>

      <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> <span data-i18n="back">Back</span> to Login</a>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
